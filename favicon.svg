<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3db8a2"/>
      <stop offset="100%" stop-color="#2a7a9b"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a7a9b"/>
      <stop offset="100%" stop-color="#1a3d50"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0f1419" stroke="url(#g1)" stroke-width="2"/>
  <!-- Back book -->
  <rect x="16" y="14" width="22" height="30" rx="2" fill="url(#g2)" opacity="0.7"/>
  <line x1="19" y1="18" x2="34" y2="18" stroke="#3db8a2" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="19" y1="22" x2="30" y2="22" stroke="#3db8a2" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Front book -->
  <rect x="22" y="18" width="24" height="30" rx="2" fill="url(#g1)"/>
  <!-- Book spine highlight -->
  <rect x="22" y="18" width="3" height="30" rx="1" fill="#2a9b8a" opacity="0.5"/>
  <!-- Book lines (text) -->
  <line x1="28" y1="26" x2="42" y2="26" stroke="#0f1419" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="30" x2="40" y2="30" stroke="#0f1419" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="34" x2="38" y2="34" stroke="#0f1419" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Small bookmark ribbon -->
  <polygon points="39,18 43,18 43,25 41,22 39,25" fill="#e05555" opacity="0.85"/>
</svg>
